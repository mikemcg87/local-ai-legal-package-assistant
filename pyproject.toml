[project]
name = "bundle-rag"
version = "0.1.0"
description = "Medical bundle RAG tool for expert witness report preparation"
requires-python = ">=3.11"
dependencies = [
    "docling[vlm]>=2.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "ollama>=0.3.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pikepdf>=8.0.0",
    "flask>=3.0.0",
    "docling-core>=2.0.0",
    "rank-bm25>=0.2.0",
    "mlx-vlm>=0.1.0",
]

[project.scripts]
bundle-rag = "bundle_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bundle_rag"]
